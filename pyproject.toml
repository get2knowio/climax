[project]
name = "climax-mcp"
version = "0.5.0"
description = "Expose any CLI as MCP tools via YAML configuration"
requires-python = ">=3.11"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "get2know.io"}]
keywords = ["mcp", "cli", "yaml", "tools", "llm", "model-context-protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Utilities",
]
dependencies = [
    # Upper bound: mcp 2.0 replaced the low-level Server decorator API
    # (@server.list_tools/@server.call_tool) with constructor-based handler
    # registration, so climax_mcp.create_server() cannot run on 2.x. See #18.
    "mcp>=1.7,<2",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "rich>=13.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.24"]
# Exact pin, not a floor: ruff's *default* rule set changes between releases,
# so a floating version silently turns main red the day a new rule ships.
# Pinning routes that change through a reviewable Dependabot PR instead.
lint = ["ruff==0.16.4"]
benchmark = ["tiktoken>=0.7"]

[project.urls]
Homepage = "https://github.com/get2knowio/climax"
Repository = "https://github.com/get2knowio/climax"
Issues = "https://github.com/get2knowio/climax/issues"

[project.scripts]
climax-mcp = "climax_mcp:main"
climax = "climax_mcp:main"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Rule selection is ruff's default set; the exact pin in the `lint` extra is
# what keeps it stable. Run locally with `uv run --extra lint ruff check .`
# so you get the same ruff CI does.

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["."]
only-include = ["climax_mcp.py", "configs", "skill"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# Supply-chain cooldown: ignore distributions uploaded in the last 7 days so a
# malicious release has time to be detected/yanked before it can be resolved.
# Relative (rolling) window; relies on PyPI's PEP 700 upload-time metadata.
exclude-newer = "7 days"
