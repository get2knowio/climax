  # ─── Polly (Text-to-Speech) ─────────────────────────────────────

  - name: aws_polly_describe_voices
    description: "List available Polly voices. Filter by language code or engine to find the right voice for speech synthesis."
    command: polly describe-voices
    args:
      - name: engine
        type: string
        description: "Filter by engine type"
        flag: "--engine"
        enum: ["standard", "neural", "long-form", "generative"]
      - name: language_code
        type: string
        description: "Filter by language (e.g. 'en-US', 'es-ES', 'fr-FR', 'de-DE', 'ja-JP')"
        flag: "--language-code"
      - name: include_additional_language_codes
        type: boolean
        description: "Include additional languages supported by bilingual voices"
        flag: "--include-additional-language-codes"
      - name: query
        type: string
        description: "JMESPath query (e.g. 'Voices[].[Id,LanguageCode,Gender,SupportedEngines]')"
        flag: "--query"
      - name: output
        type: string
        description: "Output format"
        flag: "--output"
        enum: ["json", "text", "table", "yaml"]
      - name: profile
        type: string
        description: "Named credential profile"
        flag: "--profile"
      - name: region
        type: string
        description: "AWS region"
        flag: "--region"

  - name: aws_polly_synthesize_speech
    description: "⚠️ WRITE: Convert text to speech audio. Outputs an audio file (mp3, ogg_vorbis, or pcm). Use describe-voices first to find a valid voice-id."
    command: polly synthesize-speech
    timeout: 120
    args:
      - name: text
        type: string
        description: "Text to synthesize (plain text or SSML depending on text_type)"
        required: true
        flag: "--text"
      - name: voice_id
        type: string
        description: "Voice to use (e.g. 'Joanna', 'Matthew', 'Amy', 'Brian'). Use describe-voices to list options."
        required: true
        flag: "--voice-id"
      - name: output_format
        type: string
        description: "Audio format for the output"
        required: true
        flag: "--output-format"
        enum: ["mp3", "ogg_vorbis", "pcm", "json"]
      - name: outfile
        type: string
        description: "File path to write the audio output to"
        required: true
        positional: true
      - name: engine
        type: string
        description: "Synthesis engine — neural and generative sound more natural but support fewer voices"
        flag: "--engine"
        enum: ["standard", "neural", "long-form", "generative"]
      - name: text_type
        type: string
        description: "Whether the input is plain text or SSML markup"
        flag: "--text-type"
        enum: ["text", "ssml"]
      - name: language_code
        type: string
        description: "Language code (required for bilingual voices, e.g. 'en-US', 'hi-IN')"
        flag: "--language-code"
      - name: sample_rate
        type: string
        description: "Audio sample rate in Hz (e.g. '8000', '16000', '22050', '24000')"
        flag: "--sample-rate"
      - name: lexicon_names
        type: string
        description: "Custom pronunciation lexicon names to apply"
        flag: "--lexicon-names"
      - name: profile
        type: string
        description: "Named credential profile"
        flag: "--profile"
      - name: region
        type: string
        description: "AWS region"
        flag: "--region"

  - name: aws_polly_start_speech_synthesis_task
    description: "⚠️ WRITE: Start an async speech synthesis task for long text. Output is written to an S3 bucket. Use for text too long for synchronous synthesize-speech."
    command: polly start-speech-synthesis-task
    timeout: 60
    args:
      - name: text
        type: string
        description: "Text to synthesize"
        required: true
        flag: "--text"
      - name: voice_id
        type: string
        description: "Voice to use"
        required: true
        flag: "--voice-id"
      - name: output_format
        type: string
        description: "Audio format"
        required: true
        flag: "--output-format"
        enum: ["mp3", "ogg_vorbis", "pcm", "json"]
      - name: output_s3_bucket_name
        type: string
        description: "S3 bucket to write the audio output to"
        required: true
        flag: "--output-s3-bucket-name"
      - name: output_s3_key_prefix
        type: string
        description: "S3 key prefix for the output file"
        flag: "--output-s3-key-prefix"
      - name: engine
        type: string
        description: "Synthesis engine"
        flag: "--engine"
        enum: ["standard", "neural", "long-form", "generative"]
      - name: text_type
        type: string
        description: "Whether input is plain text or SSML"
        flag: "--text-type"
        enum: ["text", "ssml"]
      - name: language_code
        type: string
        description: "Language code for bilingual voices"
        flag: "--language-code"
      - name: sample_rate
        type: string
        description: "Audio sample rate in Hz"
        flag: "--sample-rate"
      - name: sns_topic_arn
        type: string
        description: "SNS topic ARN to notify when task completes"
        flag: "--sns-topic-arn"
      - name: profile
        type: string
        description: "Named credential profile"
        flag: "--profile"
      - name: region
        type: string
        description: "AWS region"
        flag: "--region"

  - name: aws_polly_get_speech_synthesis_task
    description: "Check the status of an async speech synthesis task — see progress, output URL, and any errors."
    command: polly get-speech-synthesis-task
    args:
      - name: task_id
        type: string
        description: "Task ID returned by start-speech-synthesis-task"
        required: true
        flag: "--task-id"
      - name: output
        type: string
        description: "Output format"
        flag: "--output"
        enum: ["json", "text", "table", "yaml"]
      - name: profile
        type: string
        description: "Named credential profile"
        flag: "--profile"
      - name: region
        type: string
        description: "AWS region"
        flag: "--region"

  - name: aws_polly_list_speech_synthesis_tasks
    description: "List recent async speech synthesis tasks and their status."
    command: polly list-speech-synthesis-tasks
    args:
      - name: status
        type: string
        description: "Filter by task status"
        flag: "--status"
        enum: ["scheduled", "inProgress", "completed", "failed"]
      - name: query
        type: string
        description: "JMESPath query"
        flag: "--query"
      - name: output
        type: string
        description: "Output format"
        flag: "--output"
        enum: ["json", "text", "table", "yaml"]
      - name: profile
        type: string
        description: "Named credential profile"
        flag: "--profile"
      - name: region
        type: string
        description: "AWS region"
        flag: "--region"

  - name: aws_polly_list_lexicons
    description: "List custom pronunciation lexicons stored in your account."
    command: polly list-lexicons
    args:
      - name: query
        type: string
        description: "JMESPath query"
        flag: "--query"
      - name: output
        type: string
        description: "Output format"
        flag: "--output"
        enum: ["json", "text", "table", "yaml"]
      - name: profile
        type: string
        description: "Named credential profile"
        flag: "--profile"
      - name: region
        type: string
        description: "AWS region"
        flag: "--region"

  - name: aws_polly_get_lexicon
    description: "Get a custom pronunciation lexicon — see its PLS XML content and metadata."
    command: polly get-lexicon
    args:
      - name: name
        type: string
        description: "Lexicon name"
        required: true
        flag: "--name"
      - name: output
        type: string
        description: "Output format"
        flag: "--output"
        enum: ["json", "text", "table", "yaml"]
      - name: profile
        type: string
        description: "Named credential profile"
        flag: "--profile"
      - name: region
        type: string
        description: "AWS region"
        flag: "--region"
