        type: string
        description: "Queue URL"
        required: true
        flag: "--queue-url"
      - name: max_number_of_messages
        type: integer
        description: "Max messages to receive (1-10)"
        flag: "--max-number-of-messages"
        default: 1
      - name: wait_time_seconds
        type: integer
        description: "Long polling wait time in seconds (0-20)"
        flag: "--wait-time-seconds"
      - name: visibility_timeout
        type: integer
