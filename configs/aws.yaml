  - name: aws_sqs_send_message
    description: "⚠️ WRITE: Send a message to an SQS queue."
    command: sqs send-message
    args:
      - name: queue_url
        type: string
        description: "Queue URL"
        required: true
        flag: "--queue-url"
      - name: message_body
        type: string
        description: "Message content"
        required: true
        flag: "--message-body"
      - name: delay_seconds
        type: integer
        description: "Delay before message becomes visible (0-900)"
        flag: "--delay-seconds"
      - name: message_group_id
        type: string
        description: "Message group ID (required for FIFO queues)"
        flag: "--message-group-id"
      - name: output
