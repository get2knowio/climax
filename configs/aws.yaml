        type: string
        description: "Queue URL"
        required: true
        flag: "--queue-url"
      - name: attribute_names
        type: string
        description: "Attributes to fetch (use 'All' for everything)"
        flag: "--attribute-names"
        default: "All"
      - name: query
        type: string
        description: "JMESPath query"
        flag: "--query"
      - name: output
        type: string
