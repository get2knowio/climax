# CLImax config for the AWS CLI v2
# Covers: STS, S3, EC2, IAM, Lambda, CloudFormation, ECS, CloudWatch Logs,
#          DynamoDB, SSM, CloudWatch, Route53, EKS, RDS, SQS, SNS, Polly
#
# NOTE: AWS CLI has a massive surface area. This config covers the most
# commonly used read operations and select safe write operations.
# All commands respect --region, --profile, --output, and --query globals.

name: aws-tools
description: "MCP tools for AWS CLI v2 — manage AWS infrastructure, query services, and automate cloud operations"
command: aws
category: cloud
tags: ["aws", "cloud", "infrastructure", "devops"]

tools:
  # ─── STS (Identity) ─────────────────────────────────────────────

  - name: aws_sts_get_caller_identity
    description: "Check who you are — returns the AWS account ID, IAM user/role ARN, and user ID for the current credentials. Use this first to verify authentication."
    command: sts get-caller-identity
    args:
      - name: output
        type: string
        description: "Output format"
        flag: "--output"
        enum: ["json", "text", "table", "yaml"]
      - name: profile
        type: string
        description: "Named credential profile"
        flag: "--profile"
      - name: region
        type: string
        description: "AWS region"
        flag: "--region"

  # ─── S3 ─────────────────────────────────────────────────────────

  - name: aws_s3_ls
    description: "List S3 buckets or objects within a bucket/prefix. Without arguments, lists all buckets. With a path, lists objects."
    command: s3 ls
    args:
      - name: path
        type: string
        description: "S3 path (e.g. 's3://bucket/prefix/') — omit to list all buckets"
        positional: true
      - name: recursive
        type: boolean
        description: "List all objects recursively under the prefix"
        flag: "--recursive"
      - name: human_readable
        type: boolean
        description: "Show file sizes in human-readable format (KB, MB, GB)"
        flag: "--human-readable"
      - name: summarize
        type: boolean
        description: "Show total count and size at the end"
        flag: "--summarize"
      - name: page_size
        type: integer
        description: "Number of results per API call (use for large buckets)"
        flag: "--page-size"
      - name: profile
        type: string
        description: "Named credential profile"
        flag: "--profile"
      - name: region
        type: string
        description: "AWS region"
        flag: "--region"

  - name: aws_s3_cp
    description: "⚠️ WRITE: Copy files between local filesystem and S3, or between S3 locations. Use --dryrun to preview."
    command: s3 cp
    timeout: 300
    args:
      - name: source
        type: string
        description: "Source path (local path or s3://bucket/key)"
        required: true
        positional: true
      - name: destination
        type: string
        description: "Destination path (local path or s3://bucket/key)"
        required: true
        positional: true
      - name: recursive
        type: boolean
        description: "Copy directories/prefixes recursively"
        flag: "--recursive"
      - name: dryrun
        type: boolean
        description: "Preview what would be copied without making changes"
        flag: "--dryrun"
      - name: exclude
        type: string
        description: "Exclude pattern (e.g. '*.log')"
        flag: "--exclude"
      - name: include
        type: string
        description: "Include pattern (overrides exclude)"
        flag: "--include"
      - name: storage_class
        type: string
        description: "Storage class for uploaded objects"
        flag: "--storage-class"
        enum: ["STANDARD", "REDUCED_REDUNDANCY", "STANDARD_IA", "ONEZONE_IA", "INTELLIGENT_TIERING", "GLACIER", "DEEP_ARCHIVE"]
      - name: content_type
        type: string
        description: "Content-Type for uploaded objects"
        flag: "--content-type"
      - name: quiet
        type: boolean
        description: "Suppress progress output"
        flag: "--quiet"
      - name: profile
        type: string
        description: "Named credential profile"
        flag: "--profile"
      - name: region
        type: string
        description: "AWS region"
        flag: "--region"

  - name: aws_s3_sync
    description: "⚠️ WRITE: Sync directories between local and S3 or S3-to-S3. Only copies new/changed files. Use --dryrun to preview. WARNING: --delete removes destination files not in source."
    command: s3 sync
    timeout: 600
    args:
      - name: source
        type: string
        description: "Source path (local or s3://bucket/prefix)"
        required: true
        positional: true
      - name: destination
        type: string
        description: "Destination path (local or s3://bucket/prefix)"
        required: true
        positional: true
      - name: dryrun
        type: boolean
        description: "Preview what would be synced without making changes"
        flag: "--dryrun"
      - name: delete
        type: boolean
        description: "⚠️ DESTRUCTIVE: Delete destination files not in source"
        flag: "--delete"
      - name: exclude
        type: string
        description: "Exclude pattern"
        flag: "--exclude"
      - name: include
        type: string
        description: "Include pattern"
        flag: "--include"
      - name: size_only
        type: boolean
        description: "Compare by size only (ignore timestamps)"
        flag: "--size-only"
      - name: quiet
        type: boolean
        description: "Suppress progress output"
        flag: "--quiet"
      - name: profile
        type: string
        description: "Named credential profile"
        flag: "--profile"
      - name: region
        type: string
        description: "AWS region"
        flag: "--region"

  - name: aws_s3_presign
    description: "Generate a pre-signed URL for an S3 object — allows temporary access without credentials."
    command: s3 presign
    args:
      - name: path
        type: string
        description: "S3 object path (s3://bucket/key)"
        required: true
        positional: true
      - name: expires_in
        type: integer
        description: "URL expiration in seconds (default 3600, max 604800)"
        flag: "--expires-in"
        default: 3600
      - name: profile
        type: string
        description: "Named credential profile"
        flag: "--profile"
      - name: region
        type: string
        description: "AWS region"
        flag: "--region"

  - name: aws_s3_rm
    description: "⚠️ DESTRUCTIVE: Delete S3 objects. Use --dryrun to preview. With --recursive, deletes entire prefixes."
    command: s3 rm
    args:
      - name: path
        type: string
        description: "S3 path to delete (s3://bucket/key)"
        required: true
        positional: true
      - name: recursive
        type: boolean
        description: "⚠️ Delete all objects under the prefix"
        flag: "--recursive"
      - name: dryrun
        type: boolean
        description: "Preview what would be deleted without making changes"
        flag: "--dryrun"
      - name: exclude
        type: string
        description: "Exclude pattern"
        flag: "--exclude"
      - name: include
        type: string
        description: "Include pattern"
        flag: "--include"
      - name: quiet
        type: boolean
        description: "Suppress progress output"
        flag: "--quiet"
      - name: profile
        type: string
        description: "Named credential profile"
        flag: "--profile"
      - name: region
        type: string
        description: "AWS region"
        flag: "--region"

  # ─── EC2 ─────────────────────────────────────────────────────────

  - name: aws_ec2_describe_instances
    description: "List and describe EC2 instances. Use --filters to narrow by state, tags, VPC, instance type, etc. Returns detailed instance metadata."
    command: ec2 describe-instances
    timeout: 60
    args:
      - name: instance_ids
        type: string
        description: "Space-separated instance IDs to describe"
        flag: "--instance-ids"
      - name: filters
        type: string
        description: "Filter expression (e.g. 'Name=instance-state-name,Values=running Name=tag:Name,Values=my-server')"
        flag: "--filters"
      - name: query
        type: string
        description: "JMESPath query to filter output (e.g. 'Reservations[].Instances[].[InstanceId,State.Name,Tags[?Key==`Name`].Value|[0]]')"
        flag: "--query"
      - name: output
        type: string
        description: "Output format"
        flag: "--output"
        enum: ["json", "text", "table", "yaml"]
      - name: profile
        type: string
        description: "Named credential profile"
        flag: "--profile"
      - name: region
        type: string
        description: "AWS region"
        flag: "--region"

  - name: aws_ec2_describe_security_groups
    description: "List and describe EC2 security groups — see inbound/outbound rules, VPC association, and group metadata."
    command: ec2 describe-security-groups
    args:
      - name: group_ids
        type: string
        description: "Space-separated security group IDs"
        flag: "--group-ids"
      - name: group_names
        type: string
        description: "Space-separated security group names"
        flag: "--group-names"
      - name: filters
        type: string
        description: "Filter expression"
        flag: "--filters"
      - name: query
        type: string
        description: "JMESPath query"
        flag: "--query"
      - name: output
        type: string
        description: "Output format"
        flag: "--output"
        enum: ["json", "text", "table", "yaml"]
      - name: profile
        type: string
        description: "Named credential profile"
        flag: "--profile"
      - name: region
        type: string
        description: "AWS region"
        flag: "--region"

  - name: aws_ec2_describe_vpcs
    description: "List and describe VPCs — see CIDR blocks, state, tags, and associated resources."
    command: ec2 describe-vpcs
    args:
      - name: vpc_ids
        type: string
        description: "Space-separated VPC IDs"
        flag: "--vpc-ids"
      - name: filters
        type: string
        description: "Filter expression"
        flag: "--filters"
      - name: query
        type: string
        description: "JMESPath query"
        flag: "--query"
      - name: output
        type: string
        description: "Output format"
        flag: "--output"
        enum: ["json", "text", "table", "yaml"]
      - name: profile
        type: string
        description: "Named credential profile"
        flag: "--profile"
      - name: region
        type: string
        description: "AWS region"
        flag: "--region"

  - name: aws_ec2_describe_subnets
    description: "List and describe subnets — see CIDR, availability zone, VPC, and available IPs."
    command: ec2 describe-subnets
    args:
      - name: subnet_ids
        type: string
        description: "Space-separated subnet IDs"
        flag: "--subnet-ids"
      - name: filters
        type: string
        description: "Filter expression"
        flag: "--filters"
      - name: query
        type: string
        description: "JMESPath query"
        flag: "--query"
      - name: output
        type: string
        description: "Output format"
        flag: "--output"
        enum: ["json", "text", "table", "yaml"]
      - name: profile
        type: string
        description: "Named credential profile"
        flag: "--profile"
      - name: region
        type: string
        description: "AWS region"
        flag: "--region"

  - name: aws_ec2_describe_images
    description: "List AMIs (Amazon Machine Images). Filter by owner, name, architecture, etc."
    command: ec2 describe-images
    timeout: 60
    args:
      - name: image_ids
        type: string
        description: "Space-separated AMI IDs"
        flag: "--image-ids"
      - name: owners
        type: string
        description: "AMI owners (e.g. 'self', 'amazon', account ID)"
        flag: "--owners"
      - name: filters
        type: string
        description: "Filter expression (e.g. 'Name=name,Values=amzn2-ami-*')"
        flag: "--filters"
      - name: query
        type: string
        description: "JMESPath query"
        flag: "--query"
      - name: output
        type: string
        description: "Output format"
        flag: "--output"
        enum: ["json", "text", "table", "yaml"]
      - name: profile
        type: string
        description: "Named credential profile"
        flag: "--profile"
      - name: region
        type: string
        description: "AWS region"
        flag: "--region"

  - name: aws_ec2_start_instances
    description: "⚠️ WRITE: Start one or more stopped EC2 instances."
    command: ec2 start-instances
    timeout: 60
    args:
      - name: instance_ids
        type: string
        description: "Space-separated instance IDs to start"
        required: true
        flag: "--instance-ids"
      - name: output
        type: string
        description: "Output format"
        flag: "--output"
        enum: ["json", "text", "table", "yaml"]
      - name: profile
        type: string
        description: "Named credential profile"
        flag: "--profile"
      - name: region
        type: string
        description: "AWS region"
        flag: "--region"

  - name: aws_ec2_stop_instances
    description: "⚠️ WRITE: Stop one or more running EC2 instances. Data on instance store volumes will be lost."
    command: ec2 stop-instances
    timeout: 60
    args:
      - name: instance_ids
        type: string
        description: "Space-separated instance IDs to stop"
        required: true
        flag: "--instance-ids"
      - name: output
        type: string
        description: "Output format"
        flag: "--output"
        enum: ["json", "text", "table", "yaml"]
      - name: profile
        type: string
        description: "Named credential profile"
        flag: "--profile"
      - name: region
        type: string
        description: "AWS region"
        flag: "--region"

  # ─── IAM ─────────────────────────────────────────────────────────

  - name: aws_iam_list_users
    description: "List all IAM users in the account."
    command: iam list-users
    args:
      - name: query
        type: string
        description: "JMESPath query"
        flag: "--query"
      - name: output
        type: string
        description: "Output format"
        flag: "--output"
        enum: ["json", "text", "table", "yaml"]
      - name: profile
        type: string
        description: "Named credential profile"
        flag: "--profile"

  - name: aws_iam_list_roles
    description: "List all IAM roles in the account."
    command: iam list-roles
    args:
      - name: query
        type: string
        description: "JMESPath query"
        flag: "--query"
      - name: output
        type: string
        description: "Output format"
        flag: "--output"
        enum: ["json", "text", "table", "yaml"]
      - name: profile
        type: string
        description: "Named credential profile"
        flag: "--profile"

  - name: aws_iam_list_policies
    description: "List IAM managed policies. Use --scope to filter AWS-managed vs customer-managed."
    command: iam list-policies
    args:
      - name: scope
        type: string
        description: "Policy scope"
        flag: "--scope"
        enum: ["AWS", "Local", "All"]
      - name: only_attached
        type: boolean
        description: "Show only policies attached to entities"
        flag: "--only-attached"
      - name: query
        type: string
        description: "JMESPath query"
        flag: "--query"
      - name: output
        type: string
        description: "Output format"
        flag: "--output"
        enum: ["json", "text", "table", "yaml"]
      - name: profile
        type: string
        description: "Named credential profile"
        flag: "--profile"

  - name: aws_iam_get_user
    description: "Get details for a specific IAM user."
    command: iam get-user
    args:
      - name: user_name
        type: string
        description: "IAM user name"
        required: true
        flag: "--user-name"
      - name: output
        type: string
        description: "Output format"
        flag: "--output"
        enum: ["json", "text", "table", "yaml"]
      - name: profile
        type: string
        description: "Named credential profile"
        flag: "--profile"

  - name: aws_iam_get_role
    description: "Get details for a specific IAM role — trust policy, description, and metadata."
    command: iam get-role
    args:
      - name: role_name
        type: string
        description: "IAM role name"
        required: true
        flag: "--role-name"
      - name: output
        type: string
        description: "Output format"
        flag: "--output"
        enum: ["json", "text", "table", "yaml"]
      - name: profile
        type: string
        description: "Named credential profile"
        flag: "--profile"

  - name: aws_iam_list_attached_role_policies
    description: "List managed policies attached to a specific IAM role."
    command: iam list-attached-role-policies
    args:
      - name: role_name
        type: string
        description: "IAM role name"
        required: true
        flag: "--role-name"
      - name: query
        type: string
        description: "JMESPath query"
        flag: "--query"
      - name: output
        type: string
        description: "Output format"
        flag: "--output"
        enum: ["json", "text", "table", "yaml"]
      - name: profile
        type: string
        description: "Named credential profile"
        flag: "--profile"

  # ─── Lambda ──────────────────────────────────────────────────────

  - name: aws_lambda_list_functions
    description: "List all Lambda functions in the account/region."
    command: lambda list-functions
    args:
      - name: query
        type: string
        description: "JMESPath query"
        flag: "--query"
      - name: output
        type: string
        description: "Output format"
        flag: "--output"
        enum: ["json", "text", "table", "yaml"]
      - name: profile
        type: string
        description: "Named credential profile"
        flag: "--profile"
      - name: region
        type: string
        description: "AWS region"
        flag: "--region"

  - name: aws_lambda_get_function
    description: "Get detailed information about a Lambda function — runtime, handler, memory, timeout, environment, and code location."
    command: lambda get-function
    args:
      - name: function_name
        type: string
        description: "Function name or ARN"
        required: true
        flag: "--function-name"
      - name: qualifier
        type: string
        description: "Version or alias"
        flag: "--qualifier"
      - name: output
        type: string
        description: "Output format"
        flag: "--output"
        enum: ["json", "text", "table", "yaml"]
      - name: profile
        type: string
        description: "Named credential profile"
        flag: "--profile"
      - name: region
        type: string
        description: "AWS region"
        flag: "--region"

  - name: aws_lambda_get_function_configuration
    description: "Get only the configuration (no code location) of a Lambda function — runtime, memory, timeout, env vars, layers."
    command: lambda get-function-configuration
    args:
      - name: function_name
        type: string
        description: "Function name or ARN"
        required: true
        flag: "--function-name"
      - name: qualifier
        type: string
        description: "Version or alias"
        flag: "--qualifier"
      - name: output
        type: string
        description: "Output format"
        flag: "--output"
        enum: ["json", "text", "table", "yaml"]
      - name: profile
        type: string
        description: "Named credential profile"
        flag: "--profile"
      - name: region
        type: string
        description: "AWS region"
        flag: "--region"

  - name: aws_lambda_invoke
    description: "⚠️ WRITE: Invoke a Lambda function synchronously and get the response. Use for testing or triggering workflows."
    command: lambda invoke
    timeout: 120
    args:
      - name: function_name
        type: string
        description: "Function name or ARN"
        required: true
        flag: "--function-name"
      - name: outfile
        type: string
        description: "File to write response payload to"
        required: true
        positional: true
      - name: payload
        type: string
        description: "JSON input payload for the function"
        flag: "--payload"
      - name: invocation_type
        type: string
        description: "Invocation type"
        flag: "--invocation-type"
        enum: ["RequestResponse", "Event", "DryRun"]
      - name: log_type
        type: string
        description: "Include execution logs in response"
        flag: "--log-type"
        enum: ["None", "Tail"]
      - name: qualifier
        type: string
        description: "Version or alias"
        flag: "--qualifier"
      - name: cli_binary_format
        type: string
        description: "Binary format for payload"
        flag: "--cli-binary-format"
        enum: ["raw-in-base64-out", "base64"]
      - name: profile
        type: string
        description: "Named credential profile"
        flag: "--profile"
      - name: region
        type: string
        description: "AWS region"
        flag: "--region"

  - name: aws_lambda_list_event_source_mappings
    description: "List event source mappings (triggers) for Lambda functions — see SQS, DynamoDB, Kinesis, etc. sources."
    command: lambda list-event-source-mappings
    args:
      - name: function_name
        type: string
        description: "Filter by function name"
        flag: "--function-name"
      - name: event_source_arn
        type: string
        description: "Filter by event source ARN"
        flag: "--event-source-arn"
      - name: query
        type: string
        description: "JMESPath query"
        flag: "--query"
      - name: output
        type: string
        description: "Output format"
        flag: "--output"
        enum: ["json", "text", "table", "yaml"]
      - name: profile
        type: string
        description: "Named credential profile"
        flag: "--profile"
      - name: region
        type: string
        description: "AWS region"
        flag: "--region"

  # ─── CloudFormation ──────────────────────────────────────────────

  - name: aws_cloudformation_list_stacks
    description: "List CloudFormation stacks. Filter by status to find active, failed, or deleted stacks."
    command: cloudformation list-stacks
    args:
      - name: stack_status_filter
        type: string
        description: "Filter by status (e.g. 'CREATE_COMPLETE UPDATE_COMPLETE')"
        flag: "--stack-status-filter"
      - name: query
        type: string
        description: "JMESPath query"
        flag: "--query"
      - name: output
        type: string
        description: "Output format"
        flag: "--output"
        enum: ["json", "text", "table", "yaml"]
      - name: profile
        type: string
        description: "Named credential profile"
        flag: "--profile"
      - name: region
        type: string
        description: "AWS region"
        flag: "--region"

  - name: aws_cloudformation_describe_stacks
    description: "Get detailed information about CloudFormation stacks — parameters, outputs, status, and capabilities."
    command: cloudformation describe-stacks
    args:
      - name: stack_name
        type: string
        description: "Stack name or ID"
        flag: "--stack-name"
      - name: query
        type: string
        description: "JMESPath query"
        flag: "--query"
      - name: output
        type: string
        description: "Output format"
        flag: "--output"
        enum: ["json", "text", "table", "yaml"]
      - name: profile
        type: string
        description: "Named credential profile"
        flag: "--profile"
      - name: region
        type: string
        description: "AWS region"
        flag: "--region"

  - name: aws_cloudformation_describe_stack_events
    description: "View CloudFormation stack event history — see creation, update, and error events chronologically. Essential for debugging failed deployments."
    command: cloudformation describe-stack-events
    args:
      - name: stack_name
        type: string
        description: "Stack name or ID"
        required: true
        flag: "--stack-name"
      - name: query
        type: string
        description: "JMESPath query (e.g. 'StackEvents[?ResourceStatus==`CREATE_FAILED`]')"
        flag: "--query"
      - name: output
        type: string
        description: "Output format"
        flag: "--output"
        enum: ["json", "text", "table", "yaml"]
      - name: profile
        type: string
        description: "Named credential profile"
        flag: "--profile"
      - name: region
        type: string
        description: "AWS region"
        flag: "--region"

  - name: aws_cloudformation_describe_stack_resources
    description: "List all resources in a CloudFormation stack — see resource types, logical/physical IDs, and status."
    command: cloudformation describe-stack-resources
    args:
      - name: stack_name
        type: string
        description: "Stack name or ID"
        required: true
        flag: "--stack-name"
      - name: query
        type: string
        description: "JMESPath query"
        flag: "--query"
      - name: output
        type: string
        description: "Output format"
        flag: "--output"
        enum: ["json", "text", "table", "yaml"]
      - name: profile
        type: string
        description: "Named credential profile"
        flag: "--profile"
      - name: region
        type: string
        description: "AWS region"
        flag: "--region"

  - name: aws_cloudformation_get_template
    description: "Retrieve the CloudFormation template for a stack — useful for reviewing infrastructure-as-code."
    command: cloudformation get-template
    args:
      - name: stack_name
        type: string
        description: "Stack name or ID"
        required: true
        flag: "--stack-name"
      - name: output
        type: string
        description: "Output format"
        flag: "--output"
        enum: ["json", "text", "table", "yaml"]
      - name: profile
        type: string
        description: "Named credential profile"
        flag: "--profile"
      - name: region
        type: string
        description: "AWS region"
        flag: "--region"

  # ─── ECS ─────────────────────────────────────────────────────────

  - name: aws_ecs_list_clusters
    description: "List all ECS clusters in the account/region."
    command: ecs list-clusters
    args:
      - name: query
