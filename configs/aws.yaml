      - name: region
        type: string
        description: "AWS region"
        flag: "--region"

  - name: aws_sqs_receive_message
    description: "Receive messages from an SQS queue. Messages become invisible for the visibility timeout period."
    command: sqs receive-message
    timeout: 60
    args:
