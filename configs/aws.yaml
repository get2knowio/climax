  - name: aws_dynamodb_get_item
    description: "Get a single item by primary key. Key must use DynamoDB typed JSON (e.g. '{\"id\": {\"S\": \"123\"}}')."
    command: dynamodb get-item
    args:
      - name: table_name
        type: string
        description: "Table name"
        required: true
        flag: "--table-name"
      - name: key
        type: string
        description: "Primary key in DynamoDB JSON format"
        required: true
        flag: "--key"
      - name: consistent_read
        type: boolean
        description: "Use strongly consistent read"
        flag: "--consistent-read"
      - name: projection_expression
        type: string
        description: "Comma-separated attributes to return"
        flag: "--projection-expression"
      - name: output
        type: string
        description: "Output format"
        flag: "--output"
        enum: ["json", "text", "table", "yaml"]
      - name: profile
        type: string
        description: "Named credential profile"
        flag: "--profile"
      - name: region
        type: string
        description: "AWS region"
        flag: "--region"

  - name: aws_dynamodb_query
    description: "Query a DynamoDB table by partition key. Much more efficient than scan for known partition keys."
    command: dynamodb query
    timeout: 60
    args:
      - name: table_name
        type: string
        description: "Table name"
        required: true
        flag: "--table-name"
      - name: key_condition_expression
        type: string
        description: "Key condition (e.g. 'pk = :pk_val AND sk BEGINS_WITH :prefix')"
        required: true
        flag: "--key-condition-expression"
      - name: expression_attribute_values
        type: string
        description: "Attribute value placeholders in JSON (e.g. '{\":pk_val\": {\"S\": \"user#123\"}}')"
        required: true
        flag: "--expression-attribute-values"
      - name: expression_attribute_names
        type: string
        description: "Attribute name placeholders (for reserved words)"
        flag: "--expression-attribute-names"
      - name: filter_expression
        type: string
        description: "Post-query filter expression"
        flag: "--filter-expression"
      - name: projection_expression
        type: string
        description: "Attributes to return"
        flag: "--projection-expression"
      - name: index_name
        type: string
        description: "Secondary index name"
        flag: "--index-name"
      - name: scan_index_forward
        type: boolean
        description: "Sort ascending (true) or descending (false)"
        flag: "--scan-index-forward"
      - name: limit
        type: integer
        description: "Maximum items to evaluate"
        flag: "--limit"
      - name: select
        type: string
        description: "What to return"
        flag: "--select"
        enum: ["ALL_ATTRIBUTES", "ALL_PROJECTED_ATTRIBUTES", "COUNT", "SPECIFIC_ATTRIBUTES"]
      - name: consistent_read
        type: boolean
        description: "Use strongly consistent read"
        flag: "--consistent-read"
      - name: output
        type: string
        description: "Output format"
        flag: "--output"
        enum: ["json", "text", "table", "yaml"]
      - name: profile
        type: string
        description: "Named credential profile"
        flag: "--profile"
      - name: region
        type: string
        description: "AWS region"
        flag: "--region"

  - name: aws_dynamodb_scan
    description: "Scan an entire DynamoDB table. ⚠️ Reads every item — expensive on large tables. Prefer query when possible."
    command: dynamodb scan
    timeout: 120
    args:
      - name: table_name
        type: string
        description: "Table name"
        required: true
        flag: "--table-name"
      - name: filter_expression
        type: string
        description: "Filter expression (applied after scan, still reads all items)"
        flag: "--filter-expression"
      - name: expression_attribute_values
        type: string
        description: "Attribute value placeholders in JSON"
        flag: "--expression-attribute-values"
      - name: expression_attribute_names
        type: string
        description: "Attribute name placeholders"
        flag: "--expression-attribute-names"
      - name: projection_expression
        type: string
        description: "Attributes to return"
        flag: "--projection-expression"
      - name: limit
        type: integer
        description: "Maximum items to evaluate"
        flag: "--limit"
      - name: select
        type: string
        description: "What to return"
        flag: "--select"
        enum: ["ALL_ATTRIBUTES", "ALL_PROJECTED_ATTRIBUTES", "COUNT", "SPECIFIC_ATTRIBUTES"]
      - name: output
        type: string
        description: "Output format"
        flag: "--output"
        enum: ["json", "text", "table", "yaml"]
      - name: no_paginate
        type: boolean
        description: "Disable pagination (single page of results)"
        flag: "--no-paginate"
      - name: profile
        type: string
        description: "Named credential profile"
        flag: "--profile"
      - name: region
        type: string
        description: "AWS region"
        flag: "--region"

